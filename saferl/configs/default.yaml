# Default hyperparameters for the PyBullet SafeNav3DEnv training pipeline.
env:
  size: 10
  max_hazards: 5
  curriculum: true
  # Thrust in newtons against the agent's 10kg mass, i.e. 4.8 m/s^2 of control
  # authority. Raised 4x from 12.0 in phase 6: clearing time scales as
  # 1/sqrt(a), so 4x thrust halves the time to dodge a hazard (see the
  # lookahead_steps note below). Phase 6 needed that margin so the policy has
  # room to anticipate the shield instead of being permanently at its trigger.
  force_mag: 48.0
  goal_threshold: 1.0
  hazard_threshold: 1.3
  # physics substeps per env step: thrust is held across all of them, so the
  # control rate (~24Hz) is decoupled from PyBullet's 240Hz physics rate
  sim_substeps: 10
  # 0.0 = frictionless, as a satellite should be; sphere2.urdf's default 0.5
  # against its 10kg mass produces ~49N of static friction vs 12N of thrust,
  # which pins the agent in place and prevents any episode from terminating
  agent_friction: 0.0
  # backstop for a wandering policy; goal/collision termination is unaffected
  max_episode_steps: 1000
  # How far outside the [0, size] play area the agent may drift before the
  # episode is truncated. There is no drag and nothing walls the agent in, so
  # at 4.8 m/s^2 a wandering policy reaches |xy| ~ 158 within one episode --
  # far outside the observation space's own +/-20 bounds, and hundreds of
  # steps spent where the goal is unreachable and no hazard is in view. That
  # is dead training signal. Truncating (not terminating) keeps this a
  # bookkeeping backstop rather than a new reward term.
  bounds_margin: 5.0
  # Leaving the field is task failure, so it terminates with a penalty rather
  # than truncating for free. Measured necessity, not taste: with no penalty
  # PPO converges to flying out of bounds in ~36 steps (0% goals, reward flat
  # at -3.6) because -0.1/step makes any long episode worse than leaving. That
  # degenerate optimum also starved the constrained layer -- lambda saturated
  # at its ceiling and the intervention rate still rose. See the phase 6
  # README sweep for how this value was chosen.
  out_of_bounds_penalty: -100.0
  # debris drift speed in env units/sec; each hazard gets a random heading and
  # a speed sampled from this band, and bounces off the play-area boundary
  debris_min_speed: 0.3
  debris_max_speed: 1.2
  # with curriculum on, the upper speed bound ramps from min to max over this
  # many episodes, so early training sees near-static debris
  debris_speed_ramp_episodes: 200
  # Maximum distance at which the policy can detect a hazard. Hazards beyond
  # this range appear as zeros in the observation (same convention as unused
  # hazard slots under curriculum). The safety shield is NOT limited by this
  # -- it always sees true hazard state regardless of range (see phase 7).
  # null = unlimited (god's-eye view, the pre-phase-7 default).
  sensor_range: 6.0

shield:
  safe_dist: 2.2
  # Lookahead horizon in env steps (1 step = sim_substeps/240 s, so 20 ~ 0.83s).
  # Calibrated against control authority, not guessed. Dodging a hazard means
  # displacing sideways by hazard_threshold (1.3) before it arrives:
  # 0.5*a*t^2 >= 1.3 at a = force_mag/mass = 4.8 m/s^2 gives t >= 0.74s
  # (~18 steps), down from ~36 steps at the old 12N thrust.
  # The horizon is what bounds the shield's reachable set, and that set is
  # 0.5*a*(H*dt)^2 -- so 4x the thrust at half the horizon is the *same*
  # 1.67 units of lateral reach phase 5 had at H=40. Halving it costs no
  # safety and halves the per-check compute. Verified by sweep, not assumed:
  # see the phase 6 README table (H=12 collides, H>=16 does not).
  lookahead_steps: 20

training:
  timesteps: 30000
  # Measured, not assumed: CPU runs this workload at 837 fps against CUDA's
  # 592 on an RTX 5060 Laptop (8.1GB). The env alone runs at 2700 fps, so most
  # of the wall clock is the network -- and a 64x64 MlpPolicy is far too small
  # for the GPU to earn back its per-batch host<->device transfer. Re-measure
  # with saferl/eval/phase6/device_bench if the policy ever gets big.
  device: cpu
  algo: PPO
  policy: MlpPolicy
  verbose: 1
  output_plot: saferl_metrics.png

# Soft (learned) safety layer: PPO is penalised for needing the shield.
constrained:
  # Budget on shield interventions per step. An unconstrained policy that
  # actually stays in the field and engages the debris sits near 0.22, so this
  # asks for roughly a 4x reduction. (The earlier 0.002 was calibrated against
  # the degenerate escape policy, which only met it by leaving the field.)
  target_rate: 0.05
  # Dual-gradient step size on lambda, applied at episode boundaries. Sized
  # against the reward scale: with ~145 interventions in a ~660-step episode,
  # lambda ~ 0.7 already makes the penalty comparable to the +100 goal bonus,
  # so the useful band is single digits and lambda_max caps it there. A large
  # lr just saturates the multiplier and stops it carrying information.
  lambda_lr: 0.1
  lambda_init: 0.0
  lambda_max: 5.0
  ema_beta: 0.9

demo:
  steps: 800
  fps: 60
